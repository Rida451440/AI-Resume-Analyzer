<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ResumeAI{% endblock %} | ResumeAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">R</span>
                <span class="brand-name">Resume<span>AI</span></span>
            </a>

            <p class="nav-heading">Workspace</p>
            <nav class="nav">
                <a href="{{ url_for('home') }}" class="nav-link {% if active_page == 'upload' %}active{% endif %}">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
                    Upload Resume
                </a>
                {% if active_page == 'results' %}
                <a href="#top" class="nav-link active">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
                    Analysis Results
                </a>
                <a href="#ats" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
                    ATS Checker
                </a>
                {% else %}
                <a href="{{ url_for('home') }}#features" class="nav-link">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
                    Features
                </a>
                {% endif %}
            </nav>

            <div class="sidebar-bottom">
                <div class="profile-mark">AI</div>
                <div>
                    <strong>Resume Analyzer</strong>
                    <small>NLP-powered tool</small>
                </div>
            </div>
        </aside>

        <main class="main-content" id="top">
            {% block content %}{% endblock %}

            <footer>ResumeAI &middot; NLP-Based Job Matching System</footer>
        </main>
    </div>

    {% block scripts %}{% endblock %}
</body>
</html>
